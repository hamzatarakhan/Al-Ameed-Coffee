name: Deploy web preview

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages serves this repo at /Al-Ameed-Coffee/, so the web
      # export needs every asset URL prefixed with that subpath.
      - name: Set base path for GitHub Pages
        run: |
          node -e "
          const fs = require('fs');
          const p = './app.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.expo.experiments.baseUrl = '/Al-Ameed-Coffee';
          fs.writeFileSync(p, JSON.stringify(j, null, 2));
          "

      - run: npx expo export --platform web

      # SPA fallback + disable Jekyll (which silently drops the _expo/ bundle folder).
      - run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy dist/ to gh-pages
        working-directory: dist
        run: |
          git init -q
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
